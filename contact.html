    <form class="contact-form" id="contact-form" action="https://formsubmit.co/jkwon20241@gmail.com" method="POST">

      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">

        <input class="body" type="email" name="email" required autocomplete="email" placeholder="name@example.com">
      </label>
      <label class="field">
        <span class="label">Description</span>
        <textarea class="body" name="message" required rows="6" placeholder="What would you like to talk about?"></textarea>
      </label>
      <div class="form-foot">
        <button class="label send" type="submit">Send →</button>
        <p class="body muted" id="form-status" role="status" aria-live="polite"></p>
      </div>
    </form>
    <p class="body muted">Or write directly to <a class="plain" href="mailto:jkwon20241@gmail.com">jkwon20241@gmail.com</a></p>
